<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Old Classic Bar — 3D Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120c08;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100b08);
scene.fog = new THREE.Fog(0x100b08, 10, 19);

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  0.1,
  40
);
camera.position.set(7.7, 5.4, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.0, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5.5;
controls.maxDistance = 13;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.35;
controls.enablePan = false;

// ----------------------------
// PBR environment
// ----------------------------
const pmrem = new THREE.PMREMGenerator(renderer);
const env = new RoomEnvironment(renderer);
scene.environment = pmrem.fromScene(env, 0.035).texture;
env.dispose();
pmrem.dispose();

// ----------------------------
// Materials
// ----------------------------
const wood = new THREE.MeshStandardMaterial({
  color: 0x4a2717,
  roughness: 0.5,
  metalness: 0.04
});

const darkWood = new THREE.MeshStandardMaterial({
  color: 0x21120b,
  roughness: 0.7,
  metalness: 0.02
});

const woodTop = new THREE.MeshStandardMaterial({
  color: 0x6f3f21,
  roughness: 0.38,
  metalness: 0.05
});

const brass = new THREE.MeshStandardMaterial({
  color: 0xb58a47,
  roughness: 0.25,
  metalness: 0.8
});

const leather = new THREE.MeshStandardMaterial({
  color: 0x2d1711,
  roughness: 0.75,
  metalness: 0.0
});

const glass = new THREE.MeshPhysicalMaterial({
  color: 0xb7d0c7,
  roughness: 0.08,
  metalness: 0.02,
  transmission: 0.18,
  transparent: true,
  opacity: 0.78,
  thickness: 0.12
});

const warmMetal = new THREE.MeshStandardMaterial({
  color: 0x6a4a24,
  roughness: 0.36,
  metalness: 0.65
});

const toonGradient = (() => {
  const data = new Uint8Array([55, 115, 175, 220, 255]);
  const t = new THREE.DataTexture(data, data.length, 1, THREE.RedFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

// Cel-shaded accent material
const toonRed = new THREE.MeshToonMaterial({
  color: 0x5a2920,
  gradientMap: toonGradient
});

// ----------------------------
// Helpers
// ----------------------------
function addBox(name, size, material, position, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  m.name = name;
  m.position.set(...position);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function addCylinder(name, rt, rb, h, material, position, rotation = [0,0,0], parent = scene) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(rt, rb, h, 24),
    material
  );
  m.name = name;
  m.position.set(...position);
  m.rotation.set(...rotation);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ----------------------------
// Lighting
// ----------------------------
scene.add(new THREE.HemisphereLight(0x7e604d, 0x160b08, 1.05));

const warm = new THREE.PointLight(0xffc77a, 55, 11, 2);
warm.position.set(0, 4.4, 0.6);
warm.castShadow = true;
warm.shadow.mapSize.set(1024, 1024);
scene.add(warm);

const fill = new THREE.PointLight(0x8d4334, 16, 8, 2);
fill.position.set(-3.5, 2.5, -2.2);
scene.add(fill);

const rim = new THREE.PointLight(0x5f6f62, 11, 7, 2);
rim.position.set(3.1, 2.0, -1.5);
scene.add(rim);

// ----------------------------
// Simple room
// ----------------------------
addBox("Floor", [8.6, 0.16, 7.0], woodTop, [0, 0, 0]);
addBox("Back Wall", [8.6, 5.6, 0.18], darkWood, [0, 2.8, -3.35]);
addBox("Left Wall", [0.18, 5.6, 6.7], darkWood, [-4.22, 2.8, 0]);
addBox("Right Wall", [0.18, 5.6, 6.7], darkWood, [4.22, 2.8, 0]);

// Vertical wooden wall panels
for (let x = -3.7; x <= 3.7; x += 0.95) {
  addBox("WallPanel", [0.07, 4.9, 0.08], wood, [x, 2.65, -3.22]);
}

// Horizontal trim
addBox("UpperTrim", [8.2, 0.16, 0.22], wood, [0, 4.95, -3.22]);
addBox("LowerTrim", [8.2, 0.12, 0.18], wood, [0, 0.62, -3.22]);

// Ceiling beams
for (const x of [-2.8, 0, 2.8]) {
  addBox("CeilingBeam", [0.18, 0.2, 6.3], darkWood, [x, 5.35, 0]);
}

// ----------------------------
// Main bar
// ----------------------------
const bar = new THREE.Group();
bar.position.set(0, 0, -1.65);
scene.add(bar);

addBox("BarBody", [6.8, 1.55, 0.65], wood, [0, 1.55, 0], bar);
addBox("BarTop", [7.05, 0.17, 0.88], brass, [0, 2.38, 0], bar);

// Front decorative panels
for (let x = -2.55; x <= 2.55; x += 1.7) {
  addBox("FrontPanel", [1.35, 1.12, 0.06], darkWood, [x, 1.42, 0.35], bar);
  addBox("PanelStripe", [0.95, 0.055, 0.07], brass, [x, 1.08, 0.39], bar);
}

// Brass foot rail
addCylinder(
  "FootRail",
  0.045,
  0.045,
  6.15,
  brass,
  [0, 0.68, 0.52],
  [0, 0, Math.PI / 2],
  bar
);

// ----------------------------
// Bottle shelves
// ----------------------------
addBox("ShelfBack", [6.8, 2.25, 0.16], wood, [0, 3.42, -2.99]);
for (const y of [2.55, 3.25, 3.95]) {
  addBox("Shelf", [6.55, 0.10, 0.38], brass, [0, y, -2.75]);
}

// Bottles
const bottleColors = [0x28544a, 0x6a3327, 0x554e24, 0x3d5350, 0x5e2a21, 0x4d3d21];
const xs = [-2.65, -1.6, -0.55, 0.55, 1.6, 2.65];

for (let row = 0; row < 2; row++) {
  xs.forEach((x, i) => {
    const g = new THREE.Group();
    g.position.set(x, row === 0 ? 2.82 : 3.55, -2.55);

    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.17, 0.19, 0.60, 20),
      new THREE.MeshStandardMaterial({
        color: bottleColors[(i + row) % bottleColors.length],
        roughness: 0.24,
        metalness: 0.04
      })
    );
    body.castShadow = true;

    const neck = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.085, 0.20, 18),
      body.material
    );
    neck.position.y = 0.40;
    neck.castShadow = true;

    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, 0.06, 16),
      brass
    );
    cap.position.y = 0.53;

    g.add(body, neck, cap);
    scene.add(g);
  });
}

// ----------------------------
// Lamps
// ----------------------------
function pendant(x, z) {
  addCylinder("Cord", 0.018, 0.018, 0.7, darkWood, [x, 4.62, z]);

  const shade = new THREE.Mesh(
    new THREE.CylinderGeometry(0.27, 0.42, 0.24, 24),
    warmMetal
  );
  shade.position.set(x, 4.2, z);
  shade.castShadow = true;
  scene.add(shade);

  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 16, 12),
    new THREE.MeshStandardMaterial({
      color: 0xffe2ad,
      emissive: 0xffa34d,
      emissiveIntensity: 2.6,
      roughness: 0.2
    })
  );
  bulb.position.set(x, 4.08, z);
  scene.add(bulb);

  const light = new THREE.PointLight(0xffc070, 14, 4.2, 2);
  light.position.set(x, 4.05, z);
  scene.add(light);
}

[-2.35, 0, 2.35].forEach(x => pendant(x, 0.15));

// ----------------------------
// Stools
// ----------------------------
function stool(x) {
  const g = new THREE.Group();
  g.position.set(x, 0, -0.15);

  const seat = new THREE.Mesh(
    new THREE.CylinderGeometry(0.40, 0.40, 0.14, 28),
    leather
  );
  seat.position.y = 1.25;
  seat.castShadow = true;

  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.09, 0.9, 18),
    brass
  );
  post.position.y = 0.77;
  post.castShadow = true;

  const foot = new THREE.Mesh(
    new THREE.CylinderGeometry(0.34, 0.34, 0.06, 24),
    warmMetal
  );
  foot.position.y = 0.34;
  foot.castShadow = true;

  g.add(seat, post, foot);
  scene.add(g);
}

[-2.55, -1.3, 0, 1.3, 2.55].forEach(stool);

// ----------------------------
// Simple wall decoration
// ----------------------------
const mirrorFrame = new THREE.Mesh(
  new THREE.RingGeometry(0.92, 1.05, 40),
  brass
);
mirrorFrame.position.set(-2.45, 3.98, -3.05);
mirrorFrame.rotation.x = Math.PI / 2;
mirrorFrame.castShadow = true;
scene.add(mirrorFrame);

const mirror = new THREE.Mesh(
  new THREE.CircleGeometry(0.92, 40),
  new THREE.MeshStandardMaterial({
    color: 0x45545a,
    metalness: 0.78,
    roughness: 0.12
  })
);
mirror.position.set(-2.45, 3.98, -3.0);
mirror.rotation.x = Math.PI / 2;
scene.add(mirror);

// Old wall clock
const clockFace = new THREE.Mesh(
  new THREE.CircleGeometry(0.48, 32),
  new THREE.MeshStandardMaterial({ color: 0xe0d3b5, roughness: 0.55 })
);
clockFace.position.set(2.15, 4.0, -3.03);
clockFace.rotation.x = Math.PI / 2;
scene.add(clockFace);

const clockRim = new THREE.Mesh(
  new THREE.RingGeometry(0.49, 0.56, 32),
  brass
);
clockRim.position.copy(clockFace.position);
clockRim.position.z = -3.00;
clockRim.rotation.x = Math.PI / 2;
scene.add(clockRim);

// Minimal clock hands
addBox("ClockHand", [0.035, 0.23, 0.025], darkWood, [2.15, 4.09, -2.96]);
addBox("ClockHand", [0.035, 0.16, 0.025], darkWood, [2.27, 3.99, -2.96], scene);

// ----------------------------
// Vertex Shader accent: subtle moving light on bar top
// ----------------------------
const topTexture = new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/uv_grid_opengl.jpg"
);
topTexture.colorSpace = THREE.SRGBColorSpace;

const vertexShaderMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;

    void main() {
      vUv = uv;
      vec3 p = position;
      p.y += sin((p.x * 2.2) + uTime * 1.2) * 0.018;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;

    void main() {
      float glow = 0.78 + 0.22 * sin(vUv.x * 8.0 + vUv.y * 3.0);
      vec3 base = vec3(0.35, 0.19, 0.09);
      gl_FragColor = vec4(base * glow, 1.0);
    }
  `
});

const shaderAccent = new THREE.Mesh(
  new THREE.BoxGeometry(5.8, 0.035, 0.03, 24, 1, 1),
  vertexShaderMaterial
);
shaderAccent.position.set(0, 2.48, -1.20);
scene.add(shaderAccent);

// ----------------------------
// 3D Picking without UI:
// clicked objects get a subtle golden outline effect.
// ----------------------------
const pickable = [];
scene.traverse(o => {
  if (o.isMesh && (
      o.name.includes("Bottle") ||
      o.name.includes("Shelf") ||
      o.name.includes("Stool") ||
      o.name.includes("Bar") ||
      o.name.includes("Mirror") ||
      o.name.includes("Clock")
    )) {
    pickable.push(o);
  }
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selected = null;
let selectedBase = null;

renderer.domElement.addEventListener("pointerdown", (event) => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((event.clientY - r.top) / r.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(pickable, true);

  if (selected && selected.material && selectedBase) {
    selected.material.emissive?.set(selectedBase.color);
    if (selected.material.emissiveIntensity !== undefined) {
      selected.material.emissiveIntensity = selectedBase.intensity;
    }
  }

  selected = hit.length ? hit[0].object : null;

  if (selected?.material?.emissive) {
    selectedBase = {
      color: selected.material.emissive.clone(),
      intensity: selected.material.emissiveIntensity || 0
    };
    selected.material.emissive.set(0xb4883f);
    selected.material.emissiveIntensity = 0.5;
  }
});

// ----------------------------
// Animate
// ----------------------------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  vertexShaderMaterial.uniforms.uTime.value = t;

  warm.intensity = 55 + Math.sin(t * 1.8) * 3.0;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
